name: language_echo_flutter
description: Language Echo - AI-powered language listening mastery app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  just_audio: ^0.9.40
  shared_preferences: ^2.2.3
  flutter_animate: ^4.5.0
  provider: ^6.1.2
  path_provider: ^2.1.3
  cupertino_icons: ^1.0.6
  string_similarity: ^2.1.1
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/data/
